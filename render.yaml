services:
  - type: web
    name: veyra-sentinel
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: INFO
